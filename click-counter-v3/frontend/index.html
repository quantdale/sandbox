<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Counter v3 — Multi-Card</title>
    <!-- Load Tailwind CSS from CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <!-- Header / Control Panel -->
    <div class="bg-white shadow-md p-6 mb-8">
        <div class="max-w-7xl mx-auto">
            <h1 class="text-3xl font-bold text-gray-900 mb-4">Click Counter v3</h1>
            <p class="text-gray-600 mb-6">Generate multiple independent click counter cards. Each card has its own count stored in Redis.</p>
            
            <!-- Input & Button Section -->
            <div class="flex gap-4 items-end">
                <div>
                    <label for="cardCount" class="block text-sm font-medium text-gray-700 mb-2">
                        Number of Cards
                    </label>
                    <!-- Number input: min 1, max 1000, default 4 -->
                    <input 
                        type="number" 
                        id="cardCount" 
                        min="1" 
                        max="1000" 
                        value="4"
                        class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    />
                </div>
                <!-- Button to trigger card generation -->
                <button 
                    id="generateBtn"
                    class="px-6 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-colors"
                >
                    Generate Cards
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="max-w-7xl mx-auto px-4">
        <!-- Card Grid Container -->
        <!-- 
            Tailwind grid responsive:
            - grid-cols-1: 1 column on extra small screens
            - sm:grid-cols-2: 2 columns on small screens and up
            - lg:grid-cols-4: 4 columns on large screens and up
            - gap-4: spacing between cards
        -->
        <div 
            id="cardGrid" 
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 pb-12"
        >
            <!-- Cards will be dynamically inserted here by app.js -->
        </div>
    </div>

    <!-- Load our JavaScript application -->
    <script src="app.js"></script>
</body>
</html>
